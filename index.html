<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Systems - Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="auth" class="auth-section">
        <div class="auth-container">
            <div class="auth-header">
                <h1>AI Smart Systems</h1>
                <p>Please login or register to access the hub.</p>
            </div>

            <div class="auth-tabs">
                <button class="tab-link active" onclick="toggleAuth('login')">Login</button>
                <button class="tab-link" onclick="toggleAuth('register')">Register</button>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <h3>Welcome Back</h3>
                <input type="email" id="loginEmail" placeholder="Email Address" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit" class="auth-submit-btn">Sign In</button>
            </form>

            <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
                <h3>Create Account</h3>
                <input type="text" id="registerName" placeholder="Full Name" required>
                <input type="email" id="registerEmail" placeholder="Email Address" required>
                <input type="password" id="registerPassword" placeholder="Create Password" required>
                <button type="submit" class="auth-submit-btn" style="background: #03dac6; color: #000;">Register</button>
            </form>
        </div>
    </section>

    <input type="hidden" id="basePrice" data-price="150.00">

    <script src="script.js"></script>
</body>
</html>
